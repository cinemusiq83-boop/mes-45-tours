<style>
  :root {
    --bg: #f3ede2;
    --surface: #fffaf0;
    --text: #231a14;
    --muted: #7a6a5c;
    --accent: #b3261e;
    --line: #dccfbb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1411;
      --surface: #261d18;
      --text: #f1e7d8;
      --muted: #a8978a;
      --accent: #ec6a5e;
      --line: #3b2e26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    padding: 32px 20px 60px;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .sous-titre { color: var(--muted); margin: 0 0 24px; font-style: italic; }
  .recherche {
    display: flex; gap: 10px; align-items: center;
    background: var(--surface);
    border: 2px solid var(--text);
    border-radius: 999px;
    padding: 6px 18px;
  }
  .recherche:focus-within { border-color: var(--accent); }
  .recherche input {
    flex: 1; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 1.15rem; padding: 10px 0; outline: none;
  }
  .compteur { margin: 14px 4px 22px; color: var(--muted); font-size: .95rem; }
  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 22px;
  }
  .disque { background: var(--surface); border: 1px solid var(--line); padding: 10px 10px 14px; }
  .pochette {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    background: var(--line);
  }
  .artiste { margin: 12px 0 2px; font-weight: bold; font-size: 1.02rem; line-height: 1.25; }
  .titre { margin: 0; color: var(--muted); font-style: italic; line-height: 1.3; }
  mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; padding: 0 1px; }
  .vide { grid-column: 1 / -1; padding: 40px 0; color: var(--muted); text-align: center; }

  /* ---------- Effet vinyle : la pochette glisse, le disque sort ---------- */
  .disque { position: relative; transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s; cursor: pointer; outline: none; }
  .visuel { position: relative; }
  .pochette { position: relative; z-index: 1; box-shadow: 2px 0 8px rgba(0,0,0,.25); }
  .vinyle {
    position: absolute; z-index: 0;
    top: 3%; left: 3%; width: 94%; aspect-ratio: 1;
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .vinyle img { width: 100%; height: 100%; display: block; animation: tourne 9s linear infinite paused; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  @media (hover: hover) {
    .disque:hover, .disque:focus-visible { z-index: 5; transform: translateX(-6px); box-shadow: 0 10px 24px rgba(0,0,0,.25); }
    .disque:hover .vinyle, .disque:focus-visible .vinyle { transform: translateX(26%) rotate(30deg); }
    .disque:hover .vinyle img, .disque:focus-visible .vinyle img { animation-play-state: running; }
  }
  /* Sur téléphone : un appui sur le disque fait sortir le vinyle */
  .disque.ouvert { z-index: 5; transform: translateX(-6px); }
  .disque.ouvert .vinyle { transform: translateX(26%) rotate(30deg); }
  .disque.ouvert .vinyle img { animation-play-state: running; }
  @media (prefers-reduced-motion: reduce) {
    .disque, .vinyle { transition: none; }
    .vinyle img { animation: none; }
  }
  body { overflow-x: clip; }

  /* ---------- Version application mobile ---------- */
  html { -webkit-text-size-adjust: 100%; }
  body {
    -webkit-tap-highlight-color: transparent;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    overscroll-behavior-y: none;
  }
  .entete { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .entete h1 { margin: 0; font-size: clamp(1.7rem, 7vw, 3rem); }
  .logo { width: clamp(44px, 12vw, 64px); height: clamp(44px, 12vw, 64px); border-radius: 14px; object-fit: contain; flex: none; }
  .recherche {
    position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 20;
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
  }
  .recherche input { font-size: 1.1rem; min-width: 0; }
  @media (max-width: 480px) {
    .grille { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .disque { padding: 8px 8px 12px; }
    .artiste { font-size: .95rem; }
    .titre { font-size: .9rem; }
  }
</style>

/* ---------- Code de la recherche (inutile d'y toucher) ---------- */
const champ = document.getElementById("q");
const zone = document.getElementById("resultats");
const compteur = document.getElementById("compteur");

// Ignore les accents et les majuscules : "eli" trouve "Élie"
const normaliser = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const echapper = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Image du vinyle qui sort de la pochette (remplacez le lien si besoin) */
const VINYLE_URL = "https://www.nostalgie.be/build/images/vinyl.74ad9c39.png";
// Vinyle dessiné, utilisé si l'image ci-dessus ne se charge pas
const VINYLE_SECOURS = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="98" fill="#111"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#2a2420" stroke-width="2"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#2a2420" stroke-width="2"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#2a2420" stroke-width="2"/>
  <path d="M100 100 L30 40 A90 90 0 0 1 80 12 Z" fill="#fff" opacity=".06"/>
  <circle cx="100" cy="100" r="32" fill="#b3261e"/>
  <circle cx="100" cy="100" r="4" fill="#111"/>
</svg>`);

// Pochette par défaut : un petit disque dessiné
function pochetteParDefaut(artiste) {
  const initiale = echapper((artiste || "?").trim().charAt(0).toUpperCase());
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#3a2d26"/>
    <circle cx="100" cy="100" r="88" fill="#15110f"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#2c241f" stroke-width="2"/>
    <circle cx="100" cy="100" r="54" fill="none" stroke="#2c241f" stroke-width="2"/>
    <circle cx="100" cy="100" r="30" fill="#b3261e"/>
    <text x="100" y="109" font-family="Georgia,serif" font-size="26" fill="#fff" text-anchor="middle">${initiale}</text>
    <circle cx="100" cy="100" r="3" fill="#15110f"/>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Surligne le texte cherché
function surligner(texte, recherche) {
  if (!recherche) return echapper(texte);
  const n = normaliser(texte), i = n.indexOf(recherche);
  if (i === -1 || n.length !== texte.length) return echapper(texte);
  return echapper(texte.slice(0, i)) + "<mark>" + echapper(texte.slice(i, i + recherche.length)) + "</mark>" + echapper(texte.slice(i + recherche.length));
}

function afficher() {
  const r = normaliser(champ.value.trim());
  const trouves = disques
    .filter(d => normaliser(d.artiste + " " + d.titre).includes(r))
    .sort((a, b) => a.artiste.localeCompare(b.artiste, "fr"));

  compteur.textContent = r
    ? trouves.length + " résultat" + (trouves.length > 1 ? "s" : "") + " sur " + disques.length + " disques"
    : disques.length + " disques dans la collection";

  if (!trouves.length) {
    zone.innerHTML = '<p class="vide">Aucun 45 tours ne correspond à « ' + echapper(champ.value) + ' ».</p>';
    return;
  }

  zone.innerHTML = trouves.map(d => {
    const src = d.pochette || pochetteParDefaut(d.artiste);
    return `<article class="disque" tabindex="0">
      <div class="visuel">
        <span class="vinyle"><img src="${VINYLE_URL}" alt="" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src=VINYLE_SECOURS"></span>
        <img class="pochette" src="${echapper(src)}" alt="Pochette de ${echapper(d.titre)}" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src='${pochetteParDefaut(d.artiste).replace(/'/g, "%27")}'">
      </div>
      <p class="artiste">${surligner(d.artiste, r)}</p>
      <p class="titre">${surligner(d.titre, r)}</p>
    </article>`;
  }).join("");
}

champ.addEventListener("input", afficher);
zone.addEventListener("click", e => {
  const carte = e.target.closest(".disque");
  if (!carte) return;
  const etaitOuvert = carte.classList.contains("ouvert");
  zone.querySelectorAll(".ouvert").forEach(c => c.classList.remove("ouvert"));
  if (!etaitOuvert) carte.classList.add("ouvert");
});
afficher();

// Installation / mode hors-ligne
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
